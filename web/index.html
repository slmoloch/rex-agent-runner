<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rex Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid #21262d;
  }

  header h1 { font-size: 20px; font-weight: 600; color: #e6edf3; }
  header .meta { font-size: 13px; color: #8b949e; }

  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
  }

  .stat {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 16px 20px;
    flex: 1;
  }

  .stat .label { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 24px; font-weight: 600; color: #e6edf3; margin-top: 4px; }

  .timeline { position: relative; }

  .day-header {
    font-size: 13px;
    font-weight: 600;
    color: #8b949e;
    margin: 24px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #21262d;
  }

  .event {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .event:hover { border-color: #388bfd; }

  .event-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .event-time {
    font-size: 13px;
    color: #8b949e;
    font-variant-numeric: tabular-nums;
    min-width: 52px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .badge-main { background: #1f3a5f; color: #58a6ff; }
  .badge-new { background: #272c33; color: #8b949e; }
  .badge-telegram { background: #1a3a2a; color: #3fb950; }
  .badge-callback { background: #3a2a1a; color: #d29922; }
  .badge-send { background: #2a1a3a; color: #bc8cff; }
  .badge-gc { background: #3a1a1a; color: #f85149; }
  .badge-dispatch { background: #2a1a3a; color: #bc8cff; }

  .sessions-panel {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 32px;
  }

  .sessions-panel h2 {
    font-size: 14px;
    font-weight: 600;
    color: #e6edf3;
    margin-bottom: 12px;
  }

  .sessions-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .session-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #0d1117;
    border-radius: 6px;
    font-size: 13px;
  }

  .session-row .session-name {
    font-weight: 600;
    color: #e6edf3;
    min-width: 60px;
  }

  .session-row .session-sid {
    font-family: monospace;
    color: #8b949e;
    font-size: 12px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-row .session-status {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
  }

  .status-running { background: #1a3a2a; color: #3fb950; }
  .status-idle { background: #272c33; color: #8b949e; }

  .session-row .session-last {
    font-size: 12px;
    color: #8b949e;
    min-width: 80px;
    text-align: right;
  }

  .sessions-empty {
    font-size: 13px;
    color: #484f58;
    padding: 8px 0;
  }

  .event-meta {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: #8b949e;
    margin-left: auto;
  }

  .event-prompt {
    font-size: 14px;
    color: #c9d1d9;
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .event-details {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #21262d;
  }

  .event.expanded .event-details { display: block; }
  .event.expanded .event-prompt { white-space: normal; }

  .detail-section {
    margin-bottom: 12px;
  }

  .detail-label {
    font-size: 11px;
    font-weight: 600;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .detail-content {
    font-size: 13px;
    color: #c9d1d9;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0d1117;
    border-radius: 6px;
    padding: 12px;
    max-height: 300px;
    overflow-y: auto;
  }

  .session-id {
    font-size: 12px;
    color: #8b949e;
    font-family: monospace;
  }

  .arrow {
    display: inline-block;
    color: #484f58;
    margin: 0 2px;
  }

  .empty {
    text-align: center;
    padding: 64px 0;
    color: #484f58;
    font-size: 15px;
  }
</style>
</head>
<body>

<header>
  <h1>Rex Dashboard</h1>
  <div class="meta">Last 7 days &middot; <span id="refresh-time">loading...</span></div>
</header>

<div class="stats">
  <div class="stat">
    <div class="label">Events</div>
    <div class="value" id="stat-events">--</div>
  </div>
  <div class="stat">
    <div class="label">Total Cost</div>
    <div class="value" id="stat-cost">--</div>
  </div>
  <div class="stat">
    <div class="label">Main Session</div>
    <div class="value" id="stat-main">--</div>
  </div>
</div>

<div class="sessions-panel">
  <h2>Tracked Sessions</h2>
  <div class="sessions-list" id="sessions-list">
    <div class="sessions-empty">Loading sessions...</div>
  </div>
</div>

<div class="timeline" id="timeline">
  <div class="empty">Loading events...</div>
</div>

<script>
(function() {
  const REFRESH_INTERVAL = 30000;

  function formatTime(isoStr) {
    const d = new Date(isoStr);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(isoStr) {
    const d = new Date(isoStr);
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  function formatDuration(ms) {
    if (ms < 1000) return ms + 'ms';
    if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
    return (ms / 60000).toFixed(1) + 'm';
  }

  function formatCost(usd) {
    if (usd === 0) return '$0';
    if (usd < 0.01) return '$' + usd.toFixed(4);
    return '$' + usd.toFixed(2);
  }

  function triggerType(trigger) {
    if (trigger === 'telegram') return 'telegram';
    if (trigger === 'gc') return 'gc';
    if (trigger.startsWith('dispatch:')) return 'dispatch';
    if (trigger.startsWith('callback:') || trigger.startsWith('send:')) return trigger.split(':')[0];
    return 'callback';
  }

  function triggerLabel(trigger) {
    if (trigger === 'telegram') return 'telegram';
    if (trigger === 'gc') return 'gc';
    if (trigger.startsWith('dispatch:')) return 'dispatch';
    if (trigger.startsWith('callback:')) return trigger.substring(9);
    if (trigger.startsWith('send:')) return 'send';
    return trigger;
  }

  function renderEvent(ev) {
    const tType = triggerType(ev.trigger || 'unknown');
    const tLabel = triggerLabel(ev.trigger || 'unknown');
    const sessionClass = ev.session === 'main' ? 'badge-main' : 'badge-new';
    const triggerClass = 'badge-' + tType;

    return `
      <div class="event" onclick="this.classList.toggle('expanded')">
        <div class="event-header">
          <span class="event-time">${formatTime(ev.timestamp)}</span>
          <span class="badge ${sessionClass}">${ev.session}</span>
          <span class="arrow">&larr;</span>
          <span class="badge ${triggerClass}">${tLabel}</span>
          <div class="event-meta">
            <span>${formatDuration(ev.duration_ms || 0)}</span>
            <span>${formatCost(ev.cost_usd || 0)}</span>
          </div>
        </div>
        <div class="event-prompt">${escapeHtml(ev.prompt_preview || '')}</div>
        <div class="event-details">
          <div class="detail-section">
            <div class="detail-label">Response</div>
            <div class="detail-content">${escapeHtml(ev.response_preview || '(empty)')}</div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Session ID</div>
            <div class="session-id">${ev.session_id || '(ephemeral)'}</div>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function render(events) {
    const timeline = document.getElementById('timeline');
    const statsEvents = document.getElementById('stat-events');
    const statsCost = document.getElementById('stat-cost');
    const statsMain = document.getElementById('stat-main');
    const refreshTime = document.getElementById('refresh-time');

    refreshTime.textContent = 'updated ' + new Date().toLocaleTimeString();

    if (!events || events.length === 0) {
      timeline.innerHTML = '<div class="empty">No events in the last 7 days.</div>';
      statsEvents.textContent = '0';
      statsCost.textContent = '$0';
      statsMain.textContent = '--';
      return;
    }

    statsEvents.textContent = events.length;
    const totalCost = events.reduce(function(sum, e) { return sum + (e.cost_usd || 0); }, 0);
    statsCost.textContent = formatCost(totalCost);

    const mainEvents = events.filter(function(e) { return e.session === 'main'; });
    statsMain.textContent = mainEvents.length + ' events';

    // Group by day
    var days = {};
    events.forEach(function(ev) {
      var key = formatDate(ev.timestamp);
      if (!days[key]) days[key] = [];
      days[key].push(ev);
    });

    var html = '';
    Object.keys(days).forEach(function(day) {
      html += '<div class="day-header">' + day + '</div>';
      days[day].forEach(function(ev) {
        html += renderEvent(ev);
      });
    });

    timeline.innerHTML = html;
  }

  function timeAgo(isoStr) {
    if (!isoStr) return '?';
    var diff = Date.now() - new Date(isoStr).getTime();
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.floor(hrs / 24) + 'd ago';
  }

  function renderSessions(sessions) {
    var container = document.getElementById('sessions-list');

    if (!sessions || sessions.length === 0) {
      container.innerHTML = '<div class="sessions-empty">No tracked sessions.</div>';
      return;
    }

    var html = '';
    sessions.forEach(function(s) {
      var name = s.name || (s.is_main ? 'main' : '');
      var label = name ? name : 'unnamed';
      var statusClass = s.is_running ? 'status-running' : 'status-idle';
      var statusText = s.is_running ? 'running' : 'idle';
      var mainTag = s.is_main ? ' <span class="badge badge-main">main</span>' : '';

      html += '<div class="session-row">' +
        '<span class="session-name">' + escapeHtml(label) + mainTag + '</span>' +
        '<span class="session-sid">' + escapeHtml(s.session_id) + '</span>' +
        '<span class="session-status ' + statusClass + '">' + statusText + '</span>' +
        '<span class="session-last">' + timeAgo(s.last_activity) + '</span>' +
        '</div>';
    });

    container.innerHTML = html;
  }

  function fetchAll() {
    fetch('/api/events')
      .then(function(r) { return r.json(); })
      .then(render)
      .catch(function(err) {
        console.error('Failed to fetch events:', err);
      });

    fetch('/api/sessions')
      .then(function(r) { return r.json(); })
      .then(renderSessions)
      .catch(function(err) {
        console.error('Failed to fetch sessions:', err);
      });
  }

  fetchAll();
  setInterval(fetchAll, REFRESH_INTERVAL);
})();
</script>

</body>
</html>
